<title>01 — ABOUT</title>
<desc>Data science student learning to work with data end to end — cleaning and wrangling, exploratory analysis, modelling, then turning the results into something a non-technical reader can act on. Statistics-first: I would rather check an assumption and report uncertainty than hand over a single accuracy number. Every notebook runs top to bottom.</desc>
