<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70" fill="none" role="img" aria-label="exit — thanks for stopping by">
<title>exit — thanks for stopping by</title>
<defs><style>
@font-face{font-family:'VT323';font-style:normal;font-weight:400;src:url(data:font/ttf;base64,) format('truetype')}
text{font-family:'VT323','Courier New',monospace;font-weight:400;white-space:pre}
.t{fill:#EDEDED} .s{fill:#9A9A9A} .a{fill:#E6E6E6} .p{fill:#171717}
