name: contributions

# Redraw assets/contributions.svg from GitHub's public contribution data.
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - run: python scripts/contributions.py ${{ github.repository_owner }}

      - name: Commit if the calendar changed
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "Refresh contribution calendar"
          git push
